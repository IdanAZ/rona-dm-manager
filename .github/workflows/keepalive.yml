# Pings the Render free web service so it is less likely to sleep after 15
# minutes of idle time. No secrets are required. GitHub may delay cron by a
# few minutes; if scheduled workflows stop (inactive repo), the service can
# still sleep — the in-app comment poller backfills missed comments after wake.
name: Keep Render awake

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl Render health endpoint
        run: |
          set -euo pipefail
          url="https://rona-dm-manager.onrender.com/health"
          for i in 1 2 3 4 5; do
            echo "Attempt ${i}…"
            if curl --fail --show-error --silent --max-time 90 \
              -o /tmp/health.json -w "http_code=%{http_code}\n" "$url"; then
              cat /tmp/health.json
              echo
              exit 0
            fi
            echo "Attempt ${i} failed, retrying…"
            sleep 8
          done
          echo "Health check failed after retries"
          exit 1
